# main · v2 에 올릴 때마다: v1 정적 검사 + 회귀 테스트 (Windows · Python 3.14), v2 동기화 핵심 테스트 (Node)
name: 테스트

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: 도구 설치
        run: python -m pip install pyflakes
      - name: 정적 검사 (pyflakes)
        run: python -m pyflakes dailytodo tests todo.pyw
      - name: 테스트
        run: python -m unittest discover -s tests -v

  v2:
    # v2: 동기화 핵심(packages/core) + 데스크톱 앱 화면(apps/desktop) — 이 job 은 v2 브랜치의 ci.yml 에만 있음
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 테스트
        run: npm test
